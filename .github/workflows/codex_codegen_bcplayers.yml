name: Codex - generate BCPlayers synopsis pipeline

on:
  issues:
    types: [labeled]

jobs:
  codegen:
    if: github.event.label.name == 'codegen-bcplayers'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read

    steps:
      - uses: actions/checkout@v4

      - name: Create branch
        run: |
          BRANCH="codex/bcplayers-${{ github.event.issue.number }}"
          git checkout -b "$BRANCH"
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV

      - name: Codex generates/updates pipeline files
        uses: openai/codex-action@v1
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          prompt: |
            Add a GitHub Actions runnable pipeline to:
            - Scrape https://bcplayers.org/ and find the "Current Season" page
            - Identify each show (title + hyperlink)
            - Visit each show page and extract enough text for a synopsis (title, dates if present, description)
            - Use OpenAI Responses API model "gpt-5.2" to create ONE paragraph synopsis per show
              in a warm, witty theater-program style (do NOT imitate a named author)
            - Write all synopses to output/synopses.txt with:
              - clear show title headings
              - show URLs
              - a generated timestamp at the top
            - Script must be idempotent (overwrite synopses.txt each run)
            - Include retries/backoff for HTTP and set a safe user-agent

            IMPORTANT:
            - Do NOT include AWS, SNS, email, or any cloud integrations
            - Instead, include clearly marked TODO comments showing where AWS SNS email publishing
              could be added later.

            Deliverables to create:
            - scripts/bcplayers_synopsis.py
            - requirements.txt
            - .github/workflows/run_bcplayers_synopsis.yml
            - README section explaining usage and future AWS TODOs

            Use python3.11, requests, beautifulsoup4.
            Use OPENAI_API_KEY from GitHub Actions secrets.

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes produced."
            exit 0
          fi
          git add -A
          git commit -m "Add BCPlayers synopsis pipeline"

      - name: Push branch
        run: |
          git push -u origin "$BRANCH"

      - name: Open PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --head "$BRANCH" \
            --base "${{ github.event.repository.default_branch }}" \
            --title "Codex: BCPlayers synopsis pipeline" \
            --body "Auto-generated by Codex from issue #${{ github.event.issue.number }}."
