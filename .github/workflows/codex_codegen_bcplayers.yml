      - name: Codex generates/updates pipeline files
        uses: openai/codex-action@v1
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          prompt: |
            Add a GitHub Actions runnable pipeline to:
            - Scrape https://bcplayers.org/ and find the "Current Season" page
            - Identify each show (title + hyperlink)
            - Visit each show page and extract enough text for a synopsis (title, dates if present, description)
            - Use OpenAI Responses API model "gpt-5.2" to create ONE paragraph synopsis per show
              in a warm, witty theater-program style (do NOT imitate a named author)
            - Write all synopses to output/synopses.txt with:
              - clear show title headings
              - show URLs
              - a generated timestamp at the top
            - Script must be idempotent (overwrite synopses.txt each run)
            - Include retries/backoff for HTTP and set a safe user-agent

            IMPORTANT:
            - Do NOT include AWS, SNS, email, or any cloud integrations
            - Instead, include clearly marked TODO comments showing where
              AWS SNS email publishing could be added later

            Deliverables to create:
            - scripts/bcplayers_synopsis.py
            - requirements.txt
            - .github/workflows/run_bcplayers_synopsis.yml
            - README section explaining usage and future AWS TODOs

            Use python3.11, requests, beautifulsoup4.
            Use OPENAI_API_KEY from GitHub Actions secrets.
